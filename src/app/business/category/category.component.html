<h2 class="m-0">Cat&aacute;logo de categor&iacute;as</h2>
<p-toolbar styleClass="mb-6">
    <ng-template #start>
        <p-button label="Nueva categoría" icon="pi pi-plus" severity="secondary" class="mr-2" />
        <p-button severity="secondary" label="Eliminar seleccionadas" icon="pi pi-trash" outlined  />
    </ng-template>

    <ng-template #end>
        <p-button label="Export" icon="pi pi-upload" severity="secondary"  />
    </ng-template>
</p-toolbar>
<p-table
            #dt
            
            [rows]="10"
            
            [paginator]="true"
            [globalFilterFields]="['name', 'country.name', 'representative.name', 'status']"
            [tableStyle]="{ 'min-width': '75rem' }"
            
            [rowHover]="true"
            dataKey="id"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} products"
            [showCurrentPageReport]="true"
            [rowsPerPageOptions]="[10, 20, 30]"
        >
            <ng-template #caption>
                <div class="flex items-center justify-between">
                    <h5 class="m-0">Lista de categor&iacute;as</h5>
                    <p-iconfield>
                        <p-inputicon styleClass="pi pi-search" />
                        <input pInputText type="text"  placeholder="Search..." />
                    </p-iconfield>
                </div>
            </ng-template>
            <ng-template #header>
                <tr>
                    <th style="width: 3rem">
                        <p-tableHeaderCheckbox />
                    </th>
                    <th pSortableColumn="name" style="min-width: 16rem">Nombre <p-sortIcon field="name" /></th>
                    <th pSortableColumn="description" style="min-width:16rem">
                        Descripci&oacute;n
                        <p-sortIcon field="description" />
                    </th>
                    <th style="min-width: 12rem"></th>
                </tr>
            </ng-template>
            <ng-template #body let-product>
                <tr>
                    <td style="width: 3rem">
                        <p-tableCheckbox [value]="product" />
                    </td>
                    <td style="min-width: 12rem">{{ product.code }}</td>
                    <td style="min-width: 16rem">{{ product.name }}</td>
                    <td>
                        <img [src]="'https://primefaces.org/cdn/primeng/images/demo/product/' + product.image" [alt]="product.name" style="width: 64px" class="rounded" />
                    </td>
                    <td>{{ product.price | currency : 'USD' }}</td>
                    <td>{{ product.category }}</td>
                    <td>
                        <p-rating [(ngModel)]="product.rating" [readonly]="true" />
                    </td>
                    <td>
                        <p-tag [value]="product.inventoryStatus" />
                    </td>
                    <td>
                        <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"  />
                        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"  />
                    </td>
                </tr>
            </ng-template>
        </p-table>
